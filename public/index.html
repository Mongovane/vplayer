<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VPlayer · Vane</title>
<meta name="description" content="A weather-vane instrument panel for music. Angle carries time.">
<meta name="theme-color" content="#0A0D10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/img/vane.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/vane-180.png">
<link rel="stylesheet" href="/styles/vane.css">
<link rel="preconnect" href="https://p1.music.126.net" crossorigin>
</head>
<body>

<div class="sky" aria-hidden="true"></div>

<!-- Icon sprite: Lucide v1.34 (ISC), vendored rather than loaded from a CDN so
     the CSP can keep `default-src 'self'`. Stroke attributes live on each group
     so a bare <use> renders correctly. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-play" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></g>
    <g id="i-pause" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/></g>
    <g id="i-prev" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/><path d="M3 20V4"/></g>
    <g id="i-next" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4v16"/><path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/></g>
    <g id="i-seq" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></g>
    <g id="i-single" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></g>
    <g id="i-shuffle" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"/><path d="M2 6h1.972a4 4 0 0 1 3.6 2.2"/><path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45"/></g>
    <g id="i-cloud" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></g>
    <g id="i-gear" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17H5"/><path d="M19 7h-9"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></g>
    <g id="i-search" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g>
    <g id="i-list" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5H3"/><path d="M11 12H3"/><path d="M11 19H3"/><path d="M21 16V5"/><circle cx="18" cy="16" r="3"/></g>
    <g id="i-plus" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></g>
    <g id="i-trash" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></g>
    <g id="i-close" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></g>
    <g id="i-copy" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></g>
  </defs>
</svg>

<div class="shell">

  <header class="mast">
    <div class="mark">
      <span class="mark__glyph" aria-hidden="true"></span>
      <span class="mark__word">Vane</span>
    </div>
    <span class="gauge" id="stationRead">no signal</span>
    <span class="mast__spacer"></span>
    <button class="iconbtn" id="cloudBtn" aria-label="Cloud playlists">
      <svg viewBox="0 0 24 24"><use href="#i-cloud"/></svg>
      <span class="lamp" id="syncLamp" data-state="off"></span>
    </button>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24"><use href="#i-gear"/></svg>
    </button>
  </header>

  <main class="deck">

    <!-- ============ The station: dial, readouts, transport ============ -->
    <section class="station" id="station" data-loading="false" aria-label="Now playing">
      <div class="dial-tip num" id="dialTip" hidden aria-hidden="true"></div>

      <!-- The viewBox carries 22 units of margin so the wind barbs can sit
           outside the progress arc instead of underneath it. -->
      <svg class="dial" id="dial" viewBox="-22 -22 384 384" role="slider"
           tabindex="0" aria-label="Playback bearing — drag or use arrow keys to seek"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 percent">
        <circle class="dial__bezel" cx="170" cy="170" r="157"/>
        <circle class="dial__bezel" cx="170" cy="170" r="122"/>
        <g id="dialTicks"></g>
        <g id="dialBarbs"></g>

        <text class="dial__cardinal dial__cardinal--n" x="170" y="24" text-anchor="middle">N</text>
        <text class="dial__cardinal" x="322" y="174" text-anchor="middle">E</text>
        <text class="dial__cardinal" x="170" y="326" text-anchor="middle">S</text>
        <text class="dial__cardinal" x="18" y="174" text-anchor="middle">W</text>

        <path class="dial__arc" id="dialArc"/>

        <g class="dial__hub" id="dialHub">
          <circle cx="170" cy="170" r="122" fill="var(--ink-2)"/>
          <g id="dialBlades"></g>
          <clipPath id="hubClip"><circle cx="170" cy="170" r="122"/></clipPath>
          <circle cx="170" cy="170" r="122" fill="var(--slate)"/>
          <image id="dialCover" x="48" y="48" width="244" height="244"
                 clip-path="url(#hubClip)" preserveAspectRatio="xMidYMid slice"/>
          <!-- The vane now sits over the artwork. A flat scrim keeps brass on
               black rather than brass on whatever the sleeve happens to be. -->
          <circle cx="170" cy="170" r="122" fill="var(--ink)" opacity="0.34"/>
        </g>
        <circle cx="170" cy="170" r="122" fill="none" stroke="var(--brass)" stroke-opacity="0.28" stroke-width="0.5"/>

        <!-- Hover preview: where a click would land, and when. -->
        <line class="dial__ghost" id="dialGhost" x1="170" y1="48" x2="170" y2="18"/>

        <g class="dial__vane" id="dialVane">
          <!-- Lucide `navigation-2`, the compass needle, placed so its notch
               (12,17 in icon space) lands on the pivot: translate to the centre,
               scale up, then shift the notch to the origin. At 8.6x the tip
               reaches r=129, just inside the tick ring. -->
          <g transform="translate(170 170) scale(8.6) translate(-12 -17)">
            <polygon class="dial__vane-needle" points="12 2 19 21 12 17 5 21 12 2"/>
          </g>
          <circle class="dial__vane-collar" cx="170" cy="170" r="7.5"/>
          <circle class="dial__vane-pin" cx="170" cy="170" r="3.2"/>
        </g>
      </svg>

      <div class="readout">
        <h1 class="readout__title" id="trackTitle">Nothing on the air</h1>
        <p class="readout__artist" id="trackArtist">Load a playlist or search to begin</p>

        <div class="readout__strip">
          <span class="chip chip--brass" id="qualityChip" title="Quality as wind force">
            <span class="beaufort" id="beaufort" aria-hidden="true"></span>
            <span id="qualityText">bft —</span>
          </span>
          <span class="chip chip--wind" id="sourceChip">—</span>
          <button type="button" class="chip chip--toggle" id="resolverChip" hidden
                  aria-pressed="false" title="主源解析失败时自动回退；点一下改为直接走备用源">主源</button>
          <span class="chip" id="idChip" hidden>
            <span id="idText"></span>
            <button type="button" id="copyIdBtn" aria-label="Copy track id">
              <svg viewBox="0 0 24 24" width="12" height="12"><use href="#i-copy"/></svg>
            </button>
          </span>
        </div>

        <div class="clock">
          <span class="num" id="elapsed">0:00</span>
          <span class="num" id="bearing">000°</span>
          <span class="num" id="duration">0:00</span>
        </div>

        <div class="transport">
          <button class="tbtn" id="modeBtn" aria-label="Play mode" aria-pressed="false">
            <svg id="modeIcon" viewBox="0 0 24 24"><use href="#i-seq"/></svg>
          </button>
          <button class="tbtn" id="prevBtn" aria-label="Previous track">
            <svg viewBox="0 0 24 24"><use href="#i-prev"/></svg>
          </button>
          <button class="tbtn tbtn--primary" id="playBtn" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 24 24"><use href="#i-play"/></svg>
          </button>
          <button class="tbtn" id="nextBtn" aria-label="Next track">
            <svg viewBox="0 0 24 24"><use href="#i-next"/></svg>
          </button>
          <button class="tbtn" id="panelBtn" aria-label="Open queue">
            <svg viewBox="0 0 24 24"><use href="#i-list"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ============ The panel: four bearings ============ -->
    <section class="panel" id="panel" aria-label="Library">
      <div class="handle" id="panelHandle" role="button" tabindex="0" aria-label="Expand or collapse panel"></div>

      <div class="rose" role="tablist" aria-label="Panel views">
        <button class="rose__tab" role="tab" id="tabLyrics" aria-selected="true" aria-controls="viewLyrics" data-view="lyrics">
          <span class="rose__bearing">N</span><span class="rose__label">歌词</span>
        </button>
        <button class="rose__tab" role="tab" id="tabQueue" aria-selected="false" aria-controls="viewQueue" data-view="queue">
          <span class="rose__bearing">E</span><span class="rose__label">队列 <span class="num" id="queueCount"></span></span>
        </button>
        <button class="rose__tab" role="tab" id="tabSearch" aria-selected="false" aria-controls="viewSearch" data-view="search">
          <span class="rose__bearing">S</span><span class="rose__label">搜索</span>
        </button>
        <button class="rose__tab" role="tab" id="tabCloud" aria-selected="false" aria-controls="viewCloud" data-view="cloud">
          <span class="rose__bearing">W</span><span class="rose__label">云端</span>
        </button>
      </div>

      <div class="view" id="viewLyrics" role="tabpanel" aria-labelledby="tabLyrics">
        <div class="lyrics" id="lyrics">
          <div class="empty"><strong>没有歌词</strong>播放一首歌，歌词会跟着走</div>
        </div>
      </div>

      <div class="view" id="viewQueue" role="tabpanel" aria-labelledby="tabQueue" hidden>
        <div class="toolbar">
          <div class="field">
            <svg viewBox="0 0 24 24"><use href="#i-plus"/></svg>
            <input id="playlistInput" placeholder="歌单 ID 或分享链接" inputmode="url" autocomplete="off">
          </div>
          <button class="btn btn--brass" id="loadPlaylistBtn">载入</button>
          <button class="btn" id="shuffleBtn" title="Shuffle the queue in place">打乱</button>
        </div>
        <div class="scroller" id="queueScroller">
          <div class="scroller__sizer" id="queueSizer"></div>
        </div>
      </div>

      <div class="view" id="viewSearch" role="tabpanel" aria-labelledby="tabSearch" hidden>
        <div class="srcpick" id="sourcePick" role="group" aria-label="Search source">
          <button data-source="163" aria-pressed="true">netease</button>
          <button data-source="qq" aria-pressed="false">qq</button>
          <button data-source="kg" aria-pressed="false">kugou</button>
        </div>
        <div class="toolbar">
          <div class="field">
            <svg viewBox="0 0 24 24"><use href="#i-search"/></svg>
            <input id="searchInput" placeholder="歌名、歌手，或直接粘歌曲 ID" autocomplete="off">
          </div>
          <button class="btn btn--brass" id="searchBtn">搜</button>
        </div>
        <div class="empty" id="searchNote" hidden></div>
        <div class="scroller" id="searchScroller">
          <div class="scroller__sizer" id="searchSizer"></div>
        </div>
      </div>

      <div class="view" id="viewCloud" role="tabpanel" aria-labelledby="tabCloud" hidden>
        <div class="toolbar">
          <button class="btn btn--brass" id="cloudSaveBtn">保存当前</button>
          <button class="btn" id="cloudRefreshBtn">刷新</button>
          <button class="btn" id="cloudAuthBtn">登录</button>
        </div>
        <div class="scroller" id="cloudScroller">
          <div class="empty" id="cloudEmpty"><strong>未登录</strong>登录后歌单会跨设备同步，本地草稿可稍后上传</div>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- ============ Settings ============ -->
<div class="scrim" id="settingsScrim" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="sheet">
    <div class="sheet__head">
      <h2 id="settingsTitle">仪表设置</h2>
      <span class="gauge" style="margin-left:auto">vane</span>
      <button class="iconbtn" id="settingsClose" aria-label="Close settings">
        <svg viewBox="0 0 24 24"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="stack">
      <div>
        <p class="gauge" style="margin:0 0 8px">音质 · 蒲福风级</p>
        <div class="stack" id="qualityOptions" style="gap:6px"></div>
      </div>
      <div>
        <p class="gauge" style="margin:0 0 8px">导入</p>
        <label class="opt" for="fileInput" style="cursor:pointer">
          <div class="opt__body">
            <span class="opt__name">从文件载入歌单</span>
            <span class="opt__note">接受 .json 或旧版 playlist.js</span>
          </div>
          <svg viewBox="0 0 24 24" width="16" height="16" style="color:var(--gust-dim)"><use href="#i-plus"/></svg>
        </label>
        <input type="file" id="fileInput" accept=".json,.js" hidden>
      </div>
    </div>
  </div>
</div>

<!-- ============ Auth ============ -->
<div class="scrim" id="authScrim" role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="sheet" style="max-width:360px">
    <div class="sheet__head">
      <h2 id="authTitle">登录</h2>
      <button class="iconbtn" id="authClose" style="margin-left:auto" aria-label="Close">
        <svg viewBox="0 0 24 24"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="stack" style="gap:10px">
      <div class="field"><input id="authUser" placeholder="用户名" autocomplete="username"></div>
      <div class="field"><input id="authPass" type="password" placeholder="密码" autocomplete="current-password"></div>
      <div class="field" id="authInviteWrap" hidden><input id="authInvite" placeholder="邀请码"></div>
      <button class="btn btn--brass" id="authSubmit" style="height:38px">登录</button>
      <button class="btn" id="authToggle" style="height:38px">没有账号？注册</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
