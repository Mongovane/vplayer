<div class="shell">

  <header class="mast">
    <div class="mark">
      <span class="mark__glyph" aria-hidden="true"></span>
      <span class="mark__word">Vane</span>
    </div>
    <span class="gauge" id="stationRead">no signal</span>
    <span class="mast__spacer"></span>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 256 256"><use href="#i-gear"/></svg>
    </button>
  </header>

  <main class="deck">

    <!-- ============ The station: dial, readouts, transport ============ -->
    <section class="station" id="station" data-loading="false" aria-label="Now playing">
      <div class="dial-tip num" id="dialTip" hidden aria-hidden="true"></div>

      <!-- The viewBox carries 22 units of margin so the wind barbs can sit
           outside the progress arc instead of underneath it. -->
      <svg class="dial" id="dial" viewBox="-22 -22 384 384" role="slider"
           tabindex="0" aria-label="Playback bearing — drag or use arrow keys to seek"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 percent">
        <circle class="dial__bezel" cx="170" cy="170" r="157"/>
        <circle class="dial__bezel" cx="170" cy="170" r="122"/>
        <g id="dialTicks"></g>
        <g id="dialBarbs"></g>

        <text class="dial__cardinal dial__cardinal--n" x="170" y="24" text-anchor="middle">N</text>
        <text class="dial__cardinal" x="322" y="174" text-anchor="middle">E</text>
        <text class="dial__cardinal" x="170" y="326" text-anchor="middle">S</text>
        <text class="dial__cardinal" x="18" y="174" text-anchor="middle">W</text>

        <path class="dial__arc" id="dialArc"/>

        <g class="dial__hub" id="dialHub">
          <circle cx="170" cy="170" r="122" fill="var(--ink-2)"/>
          <g id="dialBlades"></g>
          <clipPath id="hubClip"><circle cx="170" cy="170" r="122"/></clipPath>
          <circle cx="170" cy="170" r="122" fill="var(--slate)"/>
          <image id="dialCover" x="48" y="48" width="244" height="244"
                 clip-path="url(#hubClip)" preserveAspectRatio="xMidYMid slice"/>
          <!-- The vane now sits over the artwork. A flat scrim keeps brass on
               black rather than brass on whatever the sleeve happens to be. -->
          <circle cx="170" cy="170" r="122" fill="var(--ink)" opacity="0.34"/>
        </g>
        <circle cx="170" cy="170" r="122" fill="none" stroke="var(--brass)" stroke-opacity="0.28" stroke-width="0.5"/>

        <!-- Hover preview: where a click would land, and when. -->
        <line class="dial__ghost" id="dialGhost" x1="170" y1="48" x2="170" y2="18"/>

        <g class="dial__vane" id="dialVane">
          <!-- The mark, drawn twice: a dark rim first, then the gradient body,
               so it stays readable over any sleeve. At 1.417x it stands 34 units
               tall with its apex at y=40 — a reach of r=130, the same as the
               blade it replaces. -->
          <!-- The arm is drawn in the mark's own language: paired hairlines
               rather than a solid rod, rings rather than filled dots, so the
               whole vane reads as one ribbon. A solid stem under an open outline
               looked like two objects bolted together.
               The gradient reference lives on the elements rather than in the
               stylesheet — a bare url(#id) in an external sheet resolves against
               the sheet's own URL in some browsers, which would send it looking
               for /styles/vane.css#vaneGrad. -->
          <g class="dial__vane-arm" stroke="url(#vaneGrad)">
            <path d="M167.4 78 V164 M172.6 78 V164"/>
            <path d="M167.4 178 V198 M172.6 178 V198"/>
            <circle cx="170" cy="205" r="6.4"/>
            <circle cx="170" cy="170" r="8.2"/>
          </g>
          <circle class="dial__vane-pin" cx="170" cy="170" r="2.4"/>

          <g transform="translate(153 40) scale(1.417)">
            <use class="dial__vane-rim" href="#i-vane"/>
            <use class="dial__vane-needle" href="#i-vane" fill="url(#vaneGrad)"/>
          </g>
        </g>
      </svg>

      <div class="readout">
        <h1 class="readout__title" id="trackTitle">Nothing on the air</h1>
        <p class="readout__artist" id="trackArtist">Load a playlist or search to begin</p>
        <p class="readout__fault" id="trackFault" hidden role="status"></p>

        <!-- Most of the time you want to know which line is playing, not to read
             the whole song. This shows that without opening anything, and opens
             the full column when tapped. -->
        <button type="button" class="ticker" id="lyricTicker" hidden aria-label="Open lyrics">
          <span class="ticker__now" id="tickerNow"></span>
          <span class="ticker__next" id="tickerNext"></span>
        </button>

        <div class="readout__strip">
          <span class="chip chip--brass" id="qualityChip" title="Quality as wind force">
            <span class="beaufort" id="beaufort" aria-hidden="true"></span>
            <span id="qualityText">bft —</span>
          </span>
          <span class="chip chip--wind" id="sourceChip">—</span>
          <button type="button" class="chip chip--toggle" id="resolverChip" hidden
                  aria-pressed="false" title="主源解析失败时自动回退；点一下改为直接走备用源">主源</button>
          <span class="chip" id="idChip" hidden>
            <span id="idText"></span>
            <button type="button" id="copyIdBtn" aria-label="Copy track id">
              <svg viewBox="0 0 256 256" width="12" height="12"><use href="#i-copy"/></svg>
            </button>
          </span>
        </div>

        <div class="clock">
          <span class="num" id="elapsed">0:00</span>
          <span class="num" id="bearing">000°</span>
          <span class="num" id="duration">0:00</span>
        </div>

        <div class="transport">
          <button class="tbtn" id="modeBtn" aria-label="Play mode" aria-pressed="false">
            <svg id="modeIcon" viewBox="0 0 256 256"><use href="#i-seq"/></svg>
          </button>
          <button class="tbtn" id="prevBtn" aria-label="Previous track">
            <svg viewBox="0 0 256 256"><use href="#i-prev"/></svg>
          </button>
          <button class="tbtn tbtn--primary" id="playBtn" aria-label="Play">
            <svg id="playIcon" viewBox="0 0 256 256"><use href="#i-play"/></svg>
          </button>
          <button class="tbtn" id="nextBtn" aria-label="Next track">
            <svg viewBox="0 0 256 256"><use href="#i-next"/></svg>
          </button>
          <button class="tbtn" id="panelBtn" aria-label="Open queue">
            <svg viewBox="0 0 256 256"><use href="#i-list"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ============ The panel: four bearings ============ -->
    <section class="panel" id="panel" aria-label="Library">
      <div class="handle" id="panelHandle" role="button" tabindex="0"
           aria-label="Expand or collapse panel"></div>

      <!-- Raised, the sheet covers the transport underneath it. This is the only
           way to pause without collapsing the sheet first. Narrow screens only. -->
      <div class="mini" id="miniBar">
        <span class="mini__title" id="miniTitle">Nothing on the air</span>
        <button class="mini__btn" id="miniPlay" aria-label="Play">
          <svg viewBox="0 0 256 256" id="miniPlayIcon"><use href="#i-play"/></svg>
        </button>
        <button class="mini__btn" id="miniNext" aria-label="Next track">
          <svg viewBox="0 0 256 256"><use href="#i-next"/></svg>
        </button>
      </div>

      <div class="rose" role="tablist" aria-label="Panel views">
        <button class="rose__tab" role="tab" id="tabLyrics" aria-selected="true" aria-controls="viewLyrics" data-view="lyrics">
          <span class="rose__bearing">N</span><span class="rose__label">歌词</span>
        </button>
        <button class="rose__tab" role="tab" id="tabQueue" aria-selected="false" aria-controls="viewQueue" data-view="queue">
          <span class="rose__bearing">E</span><span class="rose__label">队列 <span class="num" id="queueCount"></span></span>
        </button>
        <button class="rose__tab" role="tab" id="tabSearch" aria-selected="false" aria-controls="viewSearch" data-view="search">
          <span class="rose__bearing">S</span><span class="rose__label">搜索</span>
        </button>
        <button class="rose__tab" role="tab" id="tabLibrary" aria-selected="false" aria-controls="viewLibrary" data-view="library">
          <span class="rose__bearing">W</span><span class="rose__label">收藏 <span class="num" id="favCount"></span></span>
        </button>
      </div>

      <div class="view" id="viewLyrics" role="tabpanel" aria-labelledby="tabLyrics">
        <div class="lyrics" id="lyrics">
          <div class="empty"><strong>没有歌词</strong>播放一首歌，歌词会跟着走</div>
        </div>
      </div>

      <div class="view" id="viewQueue" role="tabpanel" aria-labelledby="tabQueue" hidden>
        <p class="context" id="contextLabel"></p>

        <!-- Hand-queued tracks, played before the context continues. Kept out of
             the virtual list: it is a handful of items, not a catalogue. -->
        <div class="upnext" id="upNextBox" hidden>
          <p class="gauge">接下来 <span class="num" id="upNextCount"></span></p>
          <div id="upNextList"></div>
        </div>

        <div class="toolbar">
          <div class="field">
            <svg viewBox="0 0 256 256"><use href="#i-plus"/></svg>
            <input id="playlistInput" placeholder="歌单 ID 或分享链接" inputmode="url" autocomplete="off">
          </div>
          <button class="btn btn--brass" id="loadPlaylistBtn">载入</button>
          <button class="btn" id="shuffleBtn" title="Shuffle the queue in place">打乱</button>
        </div>
        <div class="scroller" id="queueScroller">
          <div class="scroller__sizer" id="queueSizer"></div>
        </div>
      </div>

      <div class="view" id="viewSearch" role="tabpanel" aria-labelledby="tabSearch" hidden>
        <div class="srcpick" id="sourcePick" role="group" aria-label="Search source">
          <button data-source="163" aria-pressed="true">netease</button>
          <button data-source="qq" aria-pressed="false">qq</button>
          <button data-source="kg" aria-pressed="false">kugou</button>
        </div>
        <div class="toolbar">
          <div class="field">
            <svg viewBox="0 0 256 256"><use href="#i-search"/></svg>
            <input id="searchInput" placeholder="歌名、歌手，或直接粘歌曲 ID" autocomplete="off">
          </div>
          <button class="btn btn--brass" id="searchBtn">搜</button>
        </div>
        <div class="empty" id="searchNote" hidden></div>
        <div class="scroller" id="searchScroller">
          <div class="scroller__sizer" id="searchSizer"></div>
        </div>
      </div>

      <div class="view" id="viewLibrary" role="tabpanel" aria-labelledby="tabLibrary" hidden>
        <div class="srcpick" id="libPick" role="group" aria-label="Library section">
          <button data-lib="fav" aria-pressed="true">收藏</button>
          <button data-lib="offline" aria-pressed="false">本机 <span class="num" id="offlineCount"></span></button>
        </div>

        <div class="toolbar" id="favTools">
          <button class="btn btn--brass" id="favPlayAllBtn">全部播放</button>
          <button class="btn" id="favDownloadBtn">全部下载</button>
          <button class="btn" id="favIngestBtn" hidden>全部入库</button>
        </div>
        <div class="scroller" id="favScroller">
          <div class="scroller__sizer" id="favSizer"></div>
        </div>
        <div class="empty" id="favEmpty" hidden>
          <strong>还没有收藏</strong>搜索结果和队列里点心形加进来
        </div>

        <div class="toolbar" id="offlineTools">
          <label class="btn" for="importInput" style="display:grid;place-items:center;cursor:pointer">导入本地文件</label>
          <input type="file" id="importInput" multiple hidden
                 accept="audio/*,.mp3,.flac,.m4a,.wav,.ogg,.opus">
          <button class="btn btn--brass" id="offlinePlayAllBtn">全部播放</button>
        </div>
        <div class="scroller" id="offlineScroller">
          <div class="scroller__sizer" id="offlineSizer"></div>
        </div>
        <div class="empty" id="offlineEmpty" hidden>
          <strong>本机还没有音乐</strong>下载队列里的歌，或导入本地文件
        </div>
      </div>
    </section>

  </main>
</div>

<!-- ============ Settings ============ -->
<div class="scrim" id="settingsScrim" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="sheet">
    <div class="sheet__head">
      <h2 id="settingsTitle">仪表设置</h2>
      <span class="gauge" style="margin-left:auto">vane</span>
      <button class="iconbtn" id="settingsClose" aria-label="Close settings">
        <svg viewBox="0 0 256 256"><use href="#i-close"/></svg>
      </button>
    </div>
    <div class="stack">
      <div>
        <p class="gauge" style="margin:0 0 6px">播放音质 · 蒲福风级</p>
        <div class="srcpick" id="qualityPick" role="group" aria-label="Playback quality" style="padding:0"></div>
        <p class="opt__note" id="qualityNote" style="margin:6px 0 0"></p>
      </div>
      <div id="installRow" hidden>
        <p class="gauge" style="margin:0 0 8px">安装</p>
        <button class="opt" type="button" id="installBtn">
          <div class="opt__body">
            <span class="opt__name">添加到主屏幕</span>
            <span class="opt__note">全屏运行，锁屏可控，离线时仍能打开</span>
          </div>
          <svg viewBox="0 0 256 256" width="16" height="16" style="color:var(--gust-dim)"><use href="#i-plus"/></svg>
        </button>
      </div>

      <div>
        <p class="gauge" style="margin:0 0 6px">下载音质</p>
        <div class="srcpick" id="dlQualityPick" role="group" aria-label="Download quality" style="padding:0"></div>
        <p class="opt__note" id="dlQualityNote" style="margin:6px 0 0"></p>
      </div>

      <div id="storageRow" hidden>
        <p class="gauge" style="margin:0 0 8px">离线</p>
        <p class="opt__note num" id="offlineUsage" style="margin:0 0 8px"></p>
        <div class="srcpick" id="quotaPick" role="group" aria-label="Offline size limit"
             style="padding:0 0 10px"></div>
        <div style="display:flex; gap:6px">
          <button class="btn" id="offlinePersistBtn">申请常驻</button>
          <button class="btn" id="offlineClearBtn">清空离线</button>
        </div>
      </div>

      <div id="libraryRow" hidden>
        <p class="gauge" style="margin:0 0 8px">云端音乐库</p>
        <p class="opt__note num" id="libraryUsage" style="margin:0 0 8px"></p>
        <button class="btn" id="libraryPruneBtn">按最久未播清理</button>
      </div>

      <div>
        <p class="gauge" style="margin:0 0 8px">导入</p>
        <label class="opt" for="fileInput" style="cursor:pointer">
          <div class="opt__body">
            <span class="opt__name">从文件载入歌单</span>
            <span class="opt__note">接受 .json 或旧版 playlist.js</span>
          </div>
          <svg viewBox="0 0 256 256" width="16" height="16" style="color:var(--gust-dim)"><use href="#i-plus"/></svg>
        </label>
        <input type="file" id="fileInput" accept=".json,.js" hidden>
      </div>
    </div>
  </div>
</div>


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
