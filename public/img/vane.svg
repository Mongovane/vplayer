    <line x1="228" y1="16" x2="284" y2="16" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.3"/>
    <line x1="228" y1="20" x2="284" y2="20" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.3"/>
    <line x1="228" y1="24" x2="284" y2="24" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.3"/>
