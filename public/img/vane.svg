    <line x1="228" y1="72" x2="284" y2="72" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.3"/>
    <line x1="228" y1="76" x2="284" y2="76" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.3"/>
    <line x1="228" y1="80" x2="284" y2="80" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.3"/>
    <line x1="228" y1="84" x2="284" y2="84" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.3"/>
    <line x1="228" y1="88" x2="284" y2="88" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.3"/>
