    <g stroke="#b9343c" stroke-width="2.6" stroke-linecap="round">
      <line x1="352" y1="161" x2="358" y2="147"/>
      <line x1="359" y1="161" x2="365" y2="147"/>
      <line x1="366" y1="161" x2="372" y2="147"/>
    </g>

