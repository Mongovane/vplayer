    <linearGradient id="artisticV" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#e0314b"/>
      <stop offset="52%" stop-color="#b9343c"/>
      <stop offset="100%" stop-color="#6669b3"/>
    </linearGradient>
    <linearGradient id="artisticVFold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#fae5a8"/>
      <stop offset="45%" stop-color="#e85d68"/>
      <stop offset="100%" stop-color="#9161c6"/>
    </linearGradient>
    <linearGradient id="sheenSlash" x1="0" y1="0" x2="1" y2="0.8">
