    <radialGradient id="pearlMedallion" cx="45%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8f2f5"/>
      <stop offset="100%" stop-color="#ede2e8"/>
