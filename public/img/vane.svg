<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#fdf9fa"/>
      <stop offset="55%" stop-color="#f5eef2"/>
      <stop offset="100%" stop-color="#e8dfe6"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#b9343c" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#9161c6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4964a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strapGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#841d25"/>
      <stop offset="44%" stop-color="#d23f49"/>
      <stop offset="60%" stop-color="#b9343c"/>
      <stop offset="100%" stop-color="#841d25"/>
    </linearGradient>
    <linearGradient id="clampBezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a92a2"/>
      <stop offset="50%" stop-color="#eef2f8"/>
      <stop offset="100%" stop-color="#3c424e"/>
