    <linearGradient id="clampPlate" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#b8c1cf"/>
      <stop offset="46%" stop-color="#ffffff"/>
      <stop offset="72%" stop-color="#c6cedb"/>
      <stop offset="100%" stop-color="#9ca5b5"/>
