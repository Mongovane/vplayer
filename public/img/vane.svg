    <line x1="228" y1="4" x2="284" y2="4" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.3"/>
    <line x1="228" y1="8" x2="284" y2="8" stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.3"/>
